name: Generate Snake

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: npc-qvq
          outputs: snake.svg?palette=github-dark

      - name: Commit snake.svg
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add snake.svg
          git diff --staged --quiet || git commit -m "update snake"
          git push
