name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake GIF
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=#000000&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          cp dist/snake.svg dist/snake-dark.svg dist/snake.gif ./
          git add snake.svg snake-dark.svg snake.gif
          git diff --staged --quiet || git commit -m "update snake"
          git push
